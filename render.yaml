services:
  - type: web
    name: donyaye-no-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/ai-team/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_GROUP_PASSWORD
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
