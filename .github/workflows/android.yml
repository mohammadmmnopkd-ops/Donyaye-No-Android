name: ساخت APK دنیای نو

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌ها
        uses: actions/checkout@v4

      - name: پیدا کردن و باز کردن ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "فایل ZIP بازی پیدا نشد"
            exit 1
          fi

          mkdir project
          unzip -q "$ZIP" -d project

          echo "فایل‌های پروژه:"
          find project -maxdepth 3 -type f | head -50

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی اندروید
        uses: android-actions/setup-android@v3

      - name: نصب Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: ساخت APK
        run: |
          cd project/dn
          gradle --no-daemon assembleDebug

      - name: تحویل APK
        uses: actions/upload-artifact@v4
        with:
          name: Donyaye-No-APK
          path: project/dn/app/build/outputs/apk/debug/*.apk
