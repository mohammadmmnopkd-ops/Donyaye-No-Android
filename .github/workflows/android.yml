name: ساخت APK دنیای نو

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی اندروید
        uses: android-actions/setup-android@v3

      - name: نصب Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: آماده‌سازی پروژه
        run: |
          if [ -d "dn" ]; then
            echo "PROJECT_DIR=dn" >> "$GITHUB_ENV"
          elif [ -d "app" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "پوشه app پیدا نشد"
            exit 1
          fi

      - name: ساخت APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: Donyaye-No-APK
          path: "**/build/outputs/apk/debug/*.apk"
