name: ساخت APK دنیای نو

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی اندروید
        uses: android-actions/setup-android@v3

      - name: نصب Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: نصب ابزار اندروید
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: ساخت APK
        working-directory: dn
        run: gradle --no-daemon assembleDebug

      - name: قرار دادن APK
        uses: actions/upload-artifact@v4
        with:
          name: Donyaye-No-APK
          path: dn/app/build/outputs/apk/debug/*.apk
