name: ساخت APK دنیای نو

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: ساخت APK
        working-directory: dn
        run: gradle assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: Donyaye-No-APK
          path: dn/app/build/outputs/apk/debug/*.apk
